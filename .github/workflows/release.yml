# Baut rescue.Operator für Windows, Linux und macOS und legt ein GitHub-Release an.
# Auslöser: ein Tag wie v0.9.1 (Version in package.json vorher anheben) oder von Hand unter "Actions".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  piper-mac:
    uses: ./.github/workflows/piper-mac.yml

  whisper:
    uses: ./.github/workflows/whisper.yml

  build:
    needs: [piper-mac, whisper]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npx electron-builder --win nsis --x64 --publish never
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: ubuntu-latest
            build: npx electron-builder --linux AppImage pacman --x64 --publish never
            files: |
              release/*.AppImage
              release/*.pacman
              release/latest-linux.yml
          - os: macos-latest
            build: npx electron-builder --mac dir --x64 --arm64 --publish never && node scripts/mac-release.mjs
            files: |
              release/github/*.zip
              release/github/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/piper-holen.mjs
      - name: Piper für macOS übernehmen
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          pattern: piper-mac-*
          path: vendor/piper-mac
      - name: Piper für macOS einsortieren
        if: runner.os == 'macOS'
        run: |
          for a in arm64 x64; do
            mkdir -p vendor/piper/mac-$a
            cp -R vendor/piper-mac/piper-mac-$a/. vendor/piper/mac-$a/
            chmod +x vendor/piper/mac-$a/piper/piper
          done
          ls -R vendor/piper | head -20
      - name: Whisper übernehmen
        uses: actions/download-artifact@v4
        with:
          pattern: whisper-*
          path: vendor/whisper-dl
      - name: Whisper einsortieren
        shell: bash
        run: |
          mkdir -p vendor/whisper
          for d in vendor/whisper-dl/whisper-*; do mv "$d" "vendor/whisper/${d##*/whisper-}"; done
          # Artefakte verlieren das Ausführungsrecht
          chmod +x vendor/whisper/*/whisper-server* || true
          ls vendor/whisper
      - name: bsdtar für das pacman-Paket
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Spracherkennung im Linux-Paket prüfen
        if: runner.os == 'Linux'
        run: |
          curl -sSfL -o ggml-base-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          xvfb-run -a node scripts/whisper-probe.mjs release/linux-unpacked/rescue-operator tests/fixtures/funkspruch.wav ggml-base-q5_1.bin
      - uses: actions/upload-artifact@v4
        with:
          name: paket-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Installiert das pacman-Paket in einem frischen Arch Linux, wie auf CachyOS
  pacman-test:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paket-ubuntu-latest
          path: pakete
      - run: pacman -Syu --noconfirm
      - run: pacman -U --noconfirm pakete/*.pacman
      - name: Spiel ist installiert und als Spiel eingetragen
        run: |
          test -x /usr/bin/rescue-operator
          grep -x 'Categories=Game;Simulation;' /usr/share/applications/rescue-operator.desktop
          if ldd /opt/rescue.Operator/rescue-operator | grep 'not found'; then exit 1; fi
          # Spracherkennung liegt bei und findet ihre Bibliotheken
          if ldd /opt/rescue.Operator/resources/whisper/linux-x64/whisper-server | grep 'not found'; then exit 1; fi
      - name: Selbst-Update über pacman
        # Bietet dieselbe Paketdatei als Version 99.0.0 an. Der Job läuft als root, pkexec fragt also nicht nach dem Passwort.
        run: |
          pacman -S --noconfirm --needed polkit xorg-server-xvfb python
          mkdir upd && cp pakete/*.pacman upd/
          sed 's/^version: .*/version: 99.0.0/' pakete/latest-linux.yml > upd/latest-linux.yml
          (cd upd && python -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          LST_UPDATE_URL=http://127.0.0.1:8765/ timeout 120 xvfb-run -a /usr/bin/rescue-operator --no-sandbox || true
          pkill -f /opt/rescue.Operator || true
          grep -E '(reinstalled|upgraded) rescue-operator' /var/log/pacman.log

  release:
    needs: [build, pacman-test]
    # Auf anderen Branches nur bauen und prüfen, kein Release anlegen
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # nur die fertigen Pakete, nicht die Piper-Zwischenstände für den Mac
          pattern: paket-*
          path: pakete
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ls -la pakete
          gh release create "v$VERSION" pakete/* --title "rescue.Operator $VERSION" --generate-notes --target "$GITHUB_SHA" \
            || gh release upload "v$VERSION" pakete/* --clobber
